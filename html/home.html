<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Steven Peralta">
  <meta name="description" content="This is presentation app for creators to use to display lyrics, images, verses, and videos onto a screeen or projector">
  <link rel="stylesheet" href="/css/main.css">
  <title>Genesis</title>
</head>
<body>
  <header>
  <img class="logo" src="/img/genesisActiveLogo.png" alt="Song Icon">

  <div class="options-box">
    <div class="songs">
    <img class="song-icon" src="/icons/music-default.svg">
    <p class="song-option-title">Songs</p>
  </div>
  
  <div class="bible">
    <img class="bible-icon" src="/icons/bible-default.svg" alt="Bible Icon">
    <p class="bible-option-title">Bible</p>
  </div>
  </div>
  <!-- <p class="current-service">Sunday-02/05/2026</p> -->
  <!-- <div class="button-functions">
    <button>New Service</button>
  </div> -->
</header>

  <main>
    <section class="screens">
      <div class="preview-box">
      <p class="preview-identifcation">Preview</p>
      <div class="preview-screen">
      <p class="preview-text">This is the preview screen</p>

      <div class="preview-controls">
        <button class="back-btn" disabled><</button>
        <button class="next-btn" disabled>></button>
        <button class="live-btn" disabled>Go Live</button>
    </div>
    </div>
    </div>

    <div class="live-box">
    <p class="live-identification">Live</p>
    <div class="live-screen">
      <p class="live-text">This is the live screen</p>

      <div class="live-controls">
        <button class="live-back-btn" disabled><</button>
        <button class="live-next-btn" disabled>></button>
      </div>
    </div>
    </div>
    </section>

    <section class="panel">
      <div class="side-panel">
      <h2 class="panel-title">Collections</h2> 
      <button class="new-service-btn">+</button> 

      <div class="service-list-container">
        <ul class="service-list"></ul>
      </div>

    </div>
    </section>
  </main>
  
</body>
<script type="module" src="/js/main.js"></script>
</html>
